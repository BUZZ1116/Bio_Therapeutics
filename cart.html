<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購物車｜綠上商城</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4">
    <h2 class="text-center mb-4">購物車</h2>

    <table class="table table-bordered table-hover">
      <thead class="thead-dark">
        <tr>
          <th>商品名稱</th>
          <th>單價</th>
          <th>數量</th>
          <th>小計</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="cart-items"></tbody>
    </table>

    <div class="text-right">
      <strong>總金額：<span id="total-amount">0</span> 元</strong>
      <a href="order.html" class="btn btn-success ml-3">前往結帳</a>
    </div>
  </main>

  <div id="footer"></div>

  <!-- JS 模組 -->
  <script src="navbar.js"></script>
  <script src="footer.js"></script>
  <script src="visitCounter.js"></script>
  <script>
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const tbody = document.getElementById('cart-items');
    const totalDisplay = document.getElementById('total-amount');

    let total = 0;
    tbody.innerHTML = '';

    cart.forEach((item, i) => {
      const subtotal = item.qty * Number(item.price);
      total += subtotal;
      tbody.innerHTML += `
        <tr>
          <td>${item.title}</td>
          <td>NT$${item.price}</td>
          <td>${item.qty}</td>
          <td>NT$${subtotal}</td>
          <td>
            <button class="btn btn-sm btn-danger" onclick="remove(${i})">刪除</button>
          </td>
        </tr>`;
    });

    totalDisplay.textContent = total;

    function remove(index) {
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      location.reload();
    }
  </script>
</body>
</html>
