<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>線上商城｜首頁</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
  <div id="navbar"></div>

  <div id="app">
    <main class="container-fluid py-4">
      <h1 class="text-center mb-4">商品列表</h1>
      <div class="row justify-content-center">
        <div class="col-md-4 mb-4" v-for="item in products" :key="item.title">
          <div class="card h-100">
            <img class="card-img-top" :src="item.image" :alt="item.title">
            <div class="card-body">
              <h5 class="card-title">{{ item.title }}</h5>
              <p class="card-text">{{ item.desc }}</p>
              <p class="card-text font-weight-bold">NT${{ item.price }}</p>
              <button class="btn btn-primary btn-block" @click="addToCart(item)">加入購物車</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="footer"></div>

  <!-- Vue 與外掛 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 自訂模組 -->
  <script src="navbar.js"></script>
  <script src="footer.js"></script>
  <script src="visitCounter.js"></script>

  <!-- Vue 主程式 -->
  <script>
    new Vue({
      el: '#app',
      data: {
        products: []
      },
      created() {
        axios.get('https://sheetdb.io/api/v1/zmmdku992r01d')
          .then(res => {
            this.products = res.data;
          });
      },
      methods: {
        addToCart(item) {
          let cart = JSON.parse(localStorage.getItem('cart') || '[]');
          const found = cart.find(p => p.title === item.title);
          if (found) {
            found.qty++;
          } else {
            cart.push({ ...item, qty: 1 });
          }
          localStorage.setItem('cart', JSON.stringify(cart));
          alert(`已將「${item.title}」加入購物車`);
        }
      }
    });
  </script>
</body>
</html>
